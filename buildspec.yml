version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - npm install -g @angular/cli@22
  pre_build:
    commands:
      - npm install
  build:
    commands:
      - ng build -c production
artifacts:
  files:
    - "dist/my-angular-project/**/*"
    - appspec.yml
    - "deploy-scripts/**/*"
